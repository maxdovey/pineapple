<header class="header">
	<div class="container">
		<h1 class="logo">
			<a title="{{ site.author }}" href="{{ site.baseurl | append: "/" }}">{{ site.author }}</a>
		</h1>
		<button class="toggle-mode" aria-label="Toggle dark/light theme">
			<span class="dark-mode-on">Dark mode</span>
			<span class="light-mode-on">Light mode</span>
		</button>
		<label for="navigation" class="mobile-only navigation-menu">
			Navigation toggle
			<input type="checkbox" name="navigation" id="navigation" class="hidden">
			<span class="navigation__indicator"></span>
		</label>
		<div id="nav-header">
			<nav>
				<ul>
					{% for item in site.data.navigation.links %}
						<li>
							<a
								href="{{ item.url }}"
								class="page-link {% if item.url == page.url %}active{% endif %}"
								{% if item.url == page.url %}aria-current="page"{% endif %}
							>{{ item.title }}</a>
						</li>
					{% endfor %}
					</ul>
			</nav>			
		</div>
	</div>
</header>
